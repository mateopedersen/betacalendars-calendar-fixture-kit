name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BetaCalendars.CalendarFixtureKit.sln
      - run: dotnet build BetaCalendars.CalendarFixtureKit.sln -c Release --no-restore
      - run: dotnet test BetaCalendars.CalendarFixtureKit.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - run: dotnet format BetaCalendars.CalendarFixtureKit.sln --verify-no-changes
      - run: dotnet pack src/BetaCalendars.CalendarFixtureKit/BetaCalendars.CalendarFixtureKit.csproj -c Release --no-build -o artifacts
      - run: python3 scripts/verify_package.py artifacts/BetaCalendars.CalendarFixtureKit.0.1.0.nupkg artifacts/BetaCalendars.CalendarFixtureKit.0.1.0.snupkg
